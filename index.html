 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VEGETA TV — HitRoom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05060a;
      --panel:#0b0f16;

      --ink:#eafcff;
      --muted:rgba(234,252,255,.72);

      /* Palette : cyan -> bleu -> violet clair */
      --cyan:#00e5ff;
      --cyan-2:#00c9ff;
      --blue:#2f7dff;
      --blue-deep:#0b2a6b;
      --violet-light:#b8a0ff;

      /* Halo rose/violet + décalage logo */
      --pink:#ff4fd8;
      --violet:#8a5bff;
      --logo-shift:-10px; /* 👈 bouge le GIF un peu à gauche (ex: -6px / -14px) */

      --accent-grad: linear-gradient(180deg,
        var(--violet-light) 0%,
        rgba(184,160,255,.92) 12%,
        rgba(47,125,255,.92) 40%,
        rgba(0,201,255,.95) 78%,
        var(--cyan) 100%
      );
      --accent-grad-soft: linear-gradient(180deg,
        rgba(184,160,255,.16) 0%,
        rgba(47,125,255,.14) 44%,
        rgba(0,201,255,.14) 100%
      );

      --anim-speed: 14s;
      --accent-anim: linear-gradient(90deg,
        var(--violet-light) 0%,
        var(--blue) 38%,
        var(--cyan) 72%,
        var(--violet-light) 100%
      );
      --accent-anim-soft: linear-gradient(90deg,
        rgba(184,160,255,.16) 0%,
        rgba(47,125,255,.14) 50%,
        rgba(0,201,255,.14) 100%
      );

      --danger:#ff3b30;
      --success:#18ff6d;

      --shadow:0 14px 50px rgba(47,125,255,.16);
      --radius:16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:
        radial-gradient(48% 72% at 8% 22%, rgba(86,34,255,.22) 0%, rgba(86,34,255,.10) 22%, rgba(0,0,0,0) 56%),
        radial-gradient(62% 82% at 92% 12%, rgba(210,58,255,.24) 0%, rgba(118,36,255,.12) 24%, rgba(0,0,0,0) 58%),
        linear-gradient(180deg, #05050b 0%, #020206 100%);
      color:var(--ink);
      font-family: Oxanium, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex; align-items:flex-start; justify-content:center;
      position:relative;
      min-height:100vh;
      overflow-x:hidden;
      isolation:isolate;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(60% 46% at 84% 14%, rgba(236,76,255,.34) 0%, rgba(150,43,255,.18) 24%, rgba(0,0,0,0) 54%),
        repeating-linear-gradient(
          -14deg,
          rgba(0,0,0,0) 0 34px,
          rgba(199,66,255,0) 34px 42px,
          rgba(214,79,255,.54) 42px 48px,
          rgba(102,40,255,.38) 48px 62px,
          rgba(0,0,0,0) 62px 108px
        );
      background-size:100% 100%, 132% 118%;
      background-position:center center, 100% 0%;
      background-repeat:no-repeat;
      pointer-events:none;
      z-index:-2;
      opacity:.98;
      filter: blur(9px) saturate(128%);
      transform:translateZ(0) scale(1.03);
      will-change:transform;
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 38%, rgba(0,0,0,.28) 67%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 38%, rgba(0,0,0,.28) 67%, rgba(0,0,0,0) 100%);
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(34% 36% at 6% 24%, rgba(118,56,255,.24) 0%, rgba(90,34,255,.12) 26%, rgba(0,0,0,0) 60%),
        repeating-linear-gradient(
          36deg,
          rgba(0,0,0,0) 0 42px,
          rgba(108,42,255,0) 42px 50px,
          rgba(133,64,255,.46) 50px 55px,
          rgba(58,24,176,.30) 55px 70px,
          rgba(0,0,0,0) 70px 118px
        );
      background-size:100% 100%, 126% 118%;
      background-position:center center, -6% 0%;
      background-repeat:no-repeat;
      pointer-events:none;
      z-index:-1;
      opacity:.78;
      filter: blur(10px) saturate(120%);
      transform:translateZ(0) scale(1.02);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,.92) 18%, rgba(0,0,0,.22) 46%, rgba(0,0,0,0) 76%);
      mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,.92) 18%, rgba(0,0,0,.22) 46%, rgba(0,0,0,0) 76%);
    }

    .wrap{width:100%; max-width:860px; padding:28px 18px 60px}

    @keyframes gradientFlow{
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* HERO */
    .hero{
      width:min(960px,94vw);
      margin:12px auto 8px;
      display:grid;
      grid-template-columns: 1fr;
      place-items:center;
      gap:10px;
    }
    @media (min-width: 720px){
      .hero{
        grid-template-columns: auto 1fr;
        align-items:end;
        column-gap:24px;
      }
    }

    /* ✅ Logo : fondu plus léger, proche des bords pour garder le GIF bien visible */
    .hero__logo{
      position:relative;
      display:flex; justify-content:center; align-items:center;
      transform: translateX(var(--logo-shift));
      isolation:isolate;
      overflow:visible;
      filter:
        drop-shadow(0 0 22px rgba(47,125,255,.16))
        drop-shadow(0 0 30px rgba(255,79,216,.08));
    }
    .hero__logo::before{
      content:"";
      position:absolute;
      inset:-8% -10%;
      pointer-events:none;
      z-index:0;
      background:
        radial-gradient(ellipse at center,
          rgba(255,79,216,.10) 0%,
          rgba(138,91,255,.08) 34%,
          rgba(47,125,255,.05) 54%,
          rgba(0,0,0,0) 76%);
      filter: blur(18px);
      opacity:.72;
    }
    .hero__logo::after{
      content:"";
      position:absolute;
      inset:-4% -5%;
      pointer-events:none;
      z-index:2;
      background:
        radial-gradient(ellipse at center,
          rgba(0,0,0,0) 68%,
          rgba(5,6,10,.05) 80%,
          rgba(5,6,10,.14) 88%,
          rgba(5,6,10,.30) 94%,
          rgba(5,6,10,.58) 100%);
      filter: blur(10px);
      mix-blend-mode:normal;
    }
    .hero__logo img{
      position:relative;
      z-index:1;
      display:block;
      height:47vh;
      max-height:560px;
      width:auto;
      -webkit-mask-image:
        radial-gradient(ellipse at center,
          rgba(0,0,0,1) 62%,
          rgba(0,0,0,.995) 72%,
          rgba(0,0,0,.96) 80%,
          rgba(0,0,0,.78) 88%,
          rgba(0,0,0,.34) 95%,
          rgba(0,0,0,.10) 98%,
          rgba(0,0,0,0) 100%),
        linear-gradient(to right,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,.20) 4%,
          rgba(0,0,0,1) 10%,
          rgba(0,0,0,1) 90%,
          rgba(0,0,0,.20) 96%,
          rgba(0,0,0,0) 100%),
        linear-gradient(to bottom,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,.18) 4%,
          rgba(0,0,0,1) 10%,
          rgba(0,0,0,1) 90%,
          rgba(0,0,0,.18) 96%,
          rgba(0,0,0,0) 100%);
      mask-image:
        radial-gradient(ellipse at center,
          rgba(0,0,0,1) 62%,
          rgba(0,0,0,.995) 72%,
          rgba(0,0,0,.96) 80%,
          rgba(0,0,0,.78) 88%,
          rgba(0,0,0,.34) 95%,
          rgba(0,0,0,.10) 98%,
          rgba(0,0,0,0) 100%),
        linear-gradient(to right,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,.20) 4%,
          rgba(0,0,0,1) 10%,
          rgba(0,0,0,1) 90%,
          rgba(0,0,0,.20) 96%,
          rgba(0,0,0,0) 100%),
        linear-gradient(to bottom,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,.18) 4%,
          rgba(0,0,0,1) 10%,
          rgba(0,0,0,1) 90%,
          rgba(0,0,0,.18) 96%,
          rgba(0,0,0,0) 100%);
      -webkit-mask-repeat:no-repeat;
      mask-repeat:no-repeat;
      -webkit-mask-size:100% 100%, 100% 100%, 100% 100%;
      mask-size:100% 100%, 100% 100%, 100% 100%;
      -webkit-mask-composite: source-in, source-in;
      mask-composite: intersect;
    }

    .hero__tag{ align-self:end; text-align:center; }
    @media (min-width: 720px){ .hero__tag{ text-align:left; } }
    .tagline{
      margin:6px 0 0;
      font-size:14px;
      color:var(--muted);
      letter-spacing:.02em;
      text-shadow:0 0 12px rgba(0,229,255,.16);
    }

    /* Cards */
    .card{
      position:relative;
      overflow:hidden;
      background: linear-gradient(180deg,
        rgba(8,12,20,.42) 0%,
        rgba(6,9,16,.30) 56%,
        rgba(5,8,14,.24) 100%
      );
      border:1px solid rgba(47,125,255,.18);
      border-radius: var(--radius);
      box-shadow:
        0 18px 46px rgba(0,0,0,.26),
        0 0 0 1px rgba(0,229,255,.05) inset;
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      padding:18px;
      margin:18px 0;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,.06) 0%,
          rgba(255,255,255,.015) 24%,
          rgba(255,255,255,0) 52%
        ),
        radial-gradient(circle at top right,
          rgba(0,229,255,.10) 0%,
          rgba(0,229,255,.04) 22%,
          rgba(0,229,255,0) 56%
        );
    }
    .card > *{
      position:relative;
      z-index:1;
    }
    .card h2{
      margin:0 0 12px;
      font-size:22px;
      background: var(--accent-anim);
      background-size: 300% 300%;
      animation: gradientFlow var(--anim-speed) ease-in-out infinite;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    /* Links */
    .links{ display:grid; gap:14px; }
    @media(min-width:720px){ .links{ grid-template-columns:1fr 1fr; } }

    /* ✅ Intérieur NOIR (sans voile blanc) + effets en pseudo-elements */
    .link{
      position: relative;
      overflow: hidden;
      isolation: isolate;

      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:18px 22px;

      /* effet brouillard / verre */
      background: linear-gradient(180deg,
        rgba(7,10,16,.30) 0%,
        rgba(5,8,14,.18) 55%,
        rgba(4,7,12,.26) 100%
      );

      border:1.5px solid rgba(0,229,255,.20);
      border-radius:12px;

      color:var(--ink);
      font-weight:700; font-size:18px; text-decoration:none;

      box-shadow:
        0 12px 30px rgba(0,0,0,.24),
        0 0 0 1px rgba(47,125,255,.08) inset;
      backdrop-filter: blur(16px) saturate(138%);
      -webkit-backdrop-filter: blur(16px) saturate(138%);

      transition:.18s transform, .18s filter;
    }
    .link:hover{
      transform: translateY(-2px) scale(1.01);
      filter:brightness(1.08);
    }

    /* contour animé (gauche -> droite) */
    @keyframes borderSweep{
      0%   { background-position: 0% 50%;   opacity: .50; }
      50%  { opacity: .85; }
      100% { background-position: 200% 50%; opacity: .50; }
    }

    .link::before{
      content:"";
      position:absolute;
      inset:-2px;
      padding:2px;
      border-radius:12px;
      pointer-events:none;

      background: linear-gradient(90deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) 35%,
        rgba(0,229,255,.95) 50%,
        rgba(47,125,255,.85) 62%,
        rgba(184,160,255,.80) 75%,
        rgba(0,0,0,0) 90%,
        rgba(0,0,0,0) 100%
      );
      background-size:200% 100%;
      animation: borderSweep 6.8s ease-in-out infinite;

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;

      filter:
        drop-shadow(0 0 14px rgba(0,229,255,.22))
        drop-shadow(0 0 18px rgba(47,125,255,.18));
    }

    /* ✅ Sweep “glace” (droite -> gauche) — encore plus BRILLANT */
    @keyframes glassSweep{
      0%   { transform: translateX(150%) skewX(-12deg); opacity: 0; }
      10%  { opacity: .92; }
      50%  { opacity: .72; }
      90%  { opacity: .92; }
      100% { transform: translateX(-150%) skewX(-12deg); opacity: 0; }
    }

    .link::after{
      content:"";
      position:absolute;
      inset:-45% -75%;
      border-radius:14px;
      pointer-events:none;

      background: linear-gradient(115deg,
        rgba(0,0,0,0) 0%,
        rgba(255,255,255,0) 34%,
        rgba(0,229,255,.22) 44%,
        rgba(255,255,255,.42) 50%,
        rgba(184,160,255,.20) 56%,
        rgba(255,255,255,0) 66%,
        rgba(0,0,0,0) 82%
      );

      animation: glassSweep 7.0s ease-in-out infinite;

      filter:
        blur(.06px)
        drop-shadow(0 0 10px rgba(255,255,255,.18))
        drop-shadow(0 0 20px rgba(0,229,255,.16))
        drop-shadow(0 0 28px rgba(47,125,255,.10));

      opacity: 1;
      mix-blend-mode: normal;
    }

    /* ordre des couches */
    .link::before{ z-index:0; }
    .link::after { z-index:1; }
    .link > *    { position:relative; z-index:2; }

    .badge{
      font-weight:900;
      font-size:12px; padding:4px 10px; border-radius:999px; color:#061018;
      background: var(--accent-anim);
      background-size: 300% 300%;
      animation: gradientFlow calc(var(--anim-speed) * 1.15) ease-in-out infinite;
      flex:0 0 auto;
      border:none;
    }

    /* ====== MODAL (pour le warning) ====== */
    .modal{
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 99999;
    }
    .modal.is-open{ display:grid; }

    .modal__dialog{
      width: min(560px, 92vw);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(8,10,14,.96) 0%, rgba(5,6,10,.98) 100%);
      box-shadow:
        0 28px 80px rgba(0,0,0,.70),
        0 0 0 1px rgba(47,125,255,.18) inset;
      position: relative;
      overflow: hidden;
    }
    .modal__dialog::before{
      content:"";
      position:absolute;
      inset:-2px;
      padding:2px;
      border-radius:18px;
      pointer-events:none;
      background: linear-gradient(90deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) 35%,
        rgba(0,229,255,.92) 50%,
        rgba(47,125,255,.78) 62%,
        rgba(184,160,255,.72) 75%,
        rgba(0,0,0,0) 92%,
        rgba(0,0,0,0) 100%
      );
      background-size:200% 100%;
      animation: borderSweep 7.2s ease-in-out infinite;

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;

      filter:
        drop-shadow(0 0 18px rgba(0,229,255,.18))
        drop-shadow(0 0 22px rgba(47,125,255,.14));
    }

    .modal__content{ padding: 18px 18px 16px; }

    .modal__top{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap:10px;
      margin-bottom: 10px;
    }

    .modal__title{
      margin:0;
      font-size:18px;
      letter-spacing:.02em;
      background: var(--accent-anim);
      background-size:300% 300%;
      animation: gradientFlow var(--anim-speed) ease-in-out infinite;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .modal__close{
      width:40px; height:40px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(10,15,20,.75);
      color: var(--ink);
      cursor:pointer;
    }
    .modal__close:hover{ filter:brightness(1.1); }

    .modal__text{
      display:grid;
      gap:10px;
      color: rgba(234,252,255,.88);
      line-height:1.35;
      font-size:14px;
    }
    .modal__text .lang{
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(10,15,20,.55);
    }
    .modal__text .lang b{
      display:block;
      font-size:12px;
      color: rgba(234,252,255,.70);
      margin-bottom:6px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .modal__actions{
      display:flex;
      gap:10px;
      padding: 0 18px 18px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    .modal__btn{
      border:none;
      border-radius:12px;
      padding:12px 14px;
      font-weight:800;
      cursor:pointer;
    }

    .modal__btn--ghost{
      background: rgba(10,15,20,.75);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--ink);
    }

    .modal__btn--go{
      background: var(--accent-anim);
      background-size:300% 300%;
      animation: gradientFlow calc(var(--anim-speed) * 1.1) ease-in-out infinite;
      color:#061018;
    }

    .app-intro{
      margin: 0 0 2px;
      text-align:center;
      font-weight:900;
      font-size: clamp(18px, 3.6vw, 28px);
      letter-spacing:.03em;
      background: var(--accent-anim);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation:
        gradientFlow calc(var(--anim-speed) * 1.1) ease-in-out infinite;
      text-shadow: none;
      opacity: 0;
      transform: translateX(36px);
      transition:
        opacity .75s ease,
        transform .75s cubic-bezier(.22,.61,.36,1);
    }

    .promo-showcase{
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 520px;
      margin: 8px 0 12px;
      overflow: hidden;
    }

    .promo-slide{
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transform: translateX(100%);
      transition:
        opacity .95s ease,
        transform .95s cubic-bezier(.22,.61,.36,1);
    }

    .promo-slide.is-active{
      opacity: 1;
      transform: translateX(0);
      position: relative;
      z-index: 2;
    }

    .promo-slide.to-left{
      opacity: 0;
      transform: translateX(-100%);
      z-index: 1;
    }

    .promo-slide.to-right{
      opacity: 0;
      transform: translateX(100%);
      z-index: 3;
    }

    .promo-slide img{
      display: block;
      width: min(100%, 430px);
      max-height: 520px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,.45));
    }

    .reveal-on-scroll{
      opacity:0;
      transform: translateX(46px);
      transition:
        opacity .85s ease,
        transform .85s cubic-bezier(.22,.61,.36,1);
      will-change: transform, opacity;
    }
    .reveal-on-scroll.reveal-left{
      transform: translateX(-46px);
    }
    .reveal-on-scroll.reveal-up{
      transform: translateY(28px);
    }
    .reveal-on-scroll.is-visible{
      opacity:1;
      transform: translateX(0) translateY(0);
    }
  
    @media (max-width: 640px){
      .promo-showcase{
        min-height: 420px;
      }
      .promo-slide img{
        max-height: 420px;
        width:min(100%, 360px);
      }
    }

  </style>
</head>
<body>
  <div class="wrap">

    <!-- HERO -->
    <section class="hero">
      <div class="hero__logo">
        <img src="https://i.giphy.com/media/SDXCrfeb3q6ni3lcSa/giphy.gif" alt="VEGETA TV">
      </div>
      <div class="hero__tag">
        <p class="tagline">Telegram Community</p>
      </div>
    </section>

    <!-- Telegram -->
    <div class="card reveal-on-scroll reveal-left">
      <h2>Join our Telegram groups</h2>

      <div class="links">
        <!-- ✅ PLUS un <a> : le cadre ne fait rien -->
        <div class="link" role="group" aria-label="Telegram Group 1">
          <span class="link__icon" aria-hidden="true">📢</span>
          <span class="link__text">Telegram Group 1</span>

          <!-- ✅ Seul ACTIVE est cliquable -->
          <button class="badge" type="button"
            data-join="https://t.me/+WVYQ9wbliIIzMjk0"
            data-warn="g1">ACTIVE</button>
        </div>

        <div class="link" role="group" aria-label="Telegram Group 2">
          <span class="link__icon" aria-hidden="true">📢</span>
          <span class="link__text">Telegram Group 2</span>

          <button class="badge" type="button"
            data-join="https://t.me/+p_vIoKlVW7dkZmE8"
            data-warn="g2">ACTIVE</button>

  <!-- ✅ POP-UP warning (EN + ES) -->
  <div id="warnModal" class="modal" aria-hidden="true">

          <button class="modal__close" type="button" id="warnClose" aria-label="Close">✕</button>

            <b>Español</b>

      <div class="modal__actions">
        <button class="modal__btn modal__btn--ghost" type="button" id="warnCancel">Close</button>
        <button class="modal__btn modal__btn--go" type="button" id="warnGo">Go</button>
      </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // ✅ IMPORTANT : le cadre n'est plus un lien, donc aucun clic parasite.
    // Optionnel : on force le curseur normal sur la carte, pointer sur ACTIVE.
    document.querySelectorAll(".link").forEach(el => el.style.cursor = "default");
    document.querySelectorAll(".badge[data-join]").forEach(el => el.style.cursor = "pointer");

    let pendingJoinUrl = null;

    const modal     = $("warnModal");
    const btnClose  = $("warnClose");
    const btnCancel = $("warnCancel");
    const btnGo     = $("warnGo");

    const titleEl = $("warnTitle");
    const enEl    = $("warnEn");
    const esEl    = $("warnEs");

    const WARNINGS = {
      g1: {
        title: "⚠️ Warning / Advertencia",
        en: "If you don’t have a profile photo, you can’t join the group.",
        es: "Si no tienes foto de perfil, no puedes entrar en el grupo."
      },
      g2: {
        title: "⚠️ Warning / Advertencia",
        en: "If you don’t have a profile photo, you can’t join the group.",
        es: "Si no tienes foto de perfil, no puedes entrar en el grupo."
      }
    };

    function openWarn(url, key){
      pendingJoinUrl = url || null;

      const cfg = WARNINGS[key] || WARNINGS.g1;
      titleEl.textContent = cfg.title;
      enEl.textContent = cfg.en;
      esEl.textContent = cfg.es;

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeWarn(){
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      pendingJoinUrl = null;
    }

    btnClose.addEventListener("click", closeWarn);
    btnCancel.addEventListener("click", closeWarn);

    btnGo.addEventListener("click", ()=>{
      if(pendingJoinUrl){
        window.open(pendingJoinUrl, "_blank", "noopener");
      }
      closeWarn();
    });

    modal.addEventListener("click", (e)=>{
      if(e.target === modal) closeWarn();
    });

    document.addEventListener("keydown", (e)=>{
      if(e.key === "Escape" && modal.classList.contains("is-open")) closeWarn();
    });

    // ✅ Seul ACTIVE ouvre le pop-up
    document.querySelectorAll(".badge[data-join][data-warn]").forEach((b)=>{
      b.addEventListener("click", (e)=>{
        e.preventDefault();
        e.stopPropagation();
        openWarn(b.dataset.join, b.dataset.warn);
      });
    });
  </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const items = Array.from(document.querySelectorAll('.reveal-on-scroll'));

  const reveal = (el, delay = 0) => {
    setTimeout(() => el.classList.add('is-visible'), delay);
  };

  // First visible elements animate on page load with a clean stagger
  const firstBatch = items.filter(el => {
    const r = el.getBoundingClientRect();
    return r.top < window.innerHeight * 0.92;
  });

  firstBatch.forEach((el, i) => reveal(el, i * 120));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    });
  }, {
    threshold: 0.14,
    rootMargin: '0px 0px -8% 0px'
  });

  items.forEach(el => {
    if (!el.classList.contains('is-visible')) observer.observe(el);
  });

  const slides = Array.from(document.querySelectorAll('.promo-showcase .promo-slide'));
  let current = 0;

  if (slides.length > 1) {
    setInterval(() => {
      const prev = slides[current];
      const nextIndex = (current + 1) % slides.length;
      const next = slides[nextIndex];

      prev.classList.remove('is-active');
      prev.classList.add('to-left');

      next.classList.remove('to-left', 'to-right');
      next.classList.add('to-right');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.add('is-active');
          next.classList.remove('to-right');
        });
      });

      setTimeout(() => {
        prev.classList.remove('to-left');
      }, 980);

      current = nextIndex;
    }, 3000);
  }
});
</script>
